
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e9edf8">
<title>Nova — Digital Card</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --text: #171923;
  --muted: #73798b;
  --glass: rgba(255,255,255,.48);
  --border: rgba(255,255,255,.85);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, #ffffff 0%, transparent 45%),
    radial-gradient(ellipse at 90% 30%, #c9d5ff 0%, transparent 45%),
    radial-gradient(ellipse at 50% 100%, #d9d3f5 0%, transparent 50%),
    linear-gradient(135deg, #e9edf8, #dce3f5);
  display: flex;
  justify-content: center;
  padding: 45px 18px;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 38px 25px 28px;
  border-radius: 36px;
  background: rgba(255,255,255,.25);
  border: 1px solid rgba(255,255,255,.75);
  box-shadow: 0 25px 80px rgba(77,91,140,.13);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: rgba(255,255,255,.35);
  filter: blur(55px);
  top: -190px;
  left: -100px;
  pointer-events: none;
}

.logo {
  width: 94px;
  height: 94px;
  margin: 5px auto 20px;
  border-radius: 50%;
  background: linear-gradient(145deg, #171923, #34394b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 43px;
  font-weight: 600;
  box-shadow: 0 12px 30px rgba(20,25,45,.2);
  position: relative;
}

/* ПОЗЖЕ МОЖНО ЗАМЕНИТЬ ЗНАК N НА СВОЙ ЛОГОТИП */

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
}

h1 {
  font-size: 30px;
  margin: 0;
  font-weight: 700;
  letter-spacing: -1.2px;
}

.tagline {
  margin: 9px 0 27px;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: .4px;
}

.line {
  width: 42px;
  height: 2px;
  background: rgba(100,110,145,.4);
  margin: 0 auto 25px;
  border-radius: 5px;
}

.bio {
  font-size: 15px;
  line-height: 1.75;
  color: #414758;
  margin: 0 5px 28px;
}

.contacts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 17px;
  border-radius: 19px;
  background: var(--glass);
  border: 1px solid var(--border);
  box-shadow: 0 5px 18px rgba(80,90,130,.045);
  text-align: left;
  text-decoration: none;
  color: var(--text);
  transition: .25s ease;
}

.contact:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.75);
}

.icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: #333c53;
}

.contact-info {
  font-size: 14px;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.contact-info small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 4px;
}

.map-button {
  display: block;
  margin-top: 16px;
  padding: 17px;
  border-radius: 20px;
  background: linear-gradient(110deg, #34435f, #202b42);
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 10px 25px rgba(30,45,75,.18);
  transition: .25s;
}

.map-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(30,45,75,.25);
}

.save-button {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.85);
  background: rgba(255,255,255,.5);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .25s;
}

.save-button:hover {
  background: rgba(255,255,255,.8);
}

.socials {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 27px;
}

.social {
  width: 45px;
  height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.5);
  border: 1px solid rgba(255,255,255,.8);
  color: #28334b;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  transition: .25s;
}

.social:hover {
  transform: translateY(-4px);
  background: white;
}

footer {
  margin-top: 30px;
  color: #81899e;
  font-size: 11px;
}

@media(max-width:480px) {
  body { padding: 18px 12px; }
  .card { padding: 32px 20px 25px; border-radius: 30px; }
}
</style>
</head>

<body>

<main class="card">

  <!-- LOGO -->
  <div class="logo">N</div>

  <!-- NAME -->
  <h1>Nova Studio</h1>
  <p class="tagline">Create. Innovate. Inspire.</p>

  <div class="line"></div>

  <!-- BIO -->
  <p class="bio">
    Здесь будет небольшое описание вашей деятельности.
    Расскажите о себе, своей компании или направлении работы.
  </p>

  <!-- CONTACTS -->
  <div class="contacts">

    <a class="contact" href="tel:+821000000000">
      <svg class="icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2
        19.79 19.79 0 0 1-8.63-3.07
        19.5 19.5 0 0 1-6-6
        19.79 19.79 0 0 1-3.07-8.67
        A2 2 0 0 1 4.11 2h3a2 2 0 0 1
        2 1.72c.12.96.36 1.9.7 2.79
        a2 2 0 0 1-.45 2.11L8.09 9.91
        a16 16 0 0 0 6 6l1.27-1.27
        a2 2 0 0 1 2.11-.45c.89.34
        1.83.58 2.79.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <span class="contact-info">
        <small>Телефон</small>
        +82 10-0000-0000
      </span>
    </a>

    <a class="contact" href="mailto:hello@example.com">
      <svg class="icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <rect x="2" y="4" width="20" height="16" rx="3"/>
        <path d="m3 6 9 7 9-7"/>
      </svg>
      <span class="contact-info">
        <small>Электронная почта</small>
        hello@example.com
      </span>
    </a>

    <a class="contact"
       href="https://maps.google.com/?q=Seoul+South+Korea"
       target="_blank">
      <svg class="icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10
        a8 8 0 1 1 16 0Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span class="contact-info">
        <small>Адрес</small>
        Seoul, South Korea
      </span>
    </a>

  </div>

  <!-- MAP -->
  <a class="map-button"
     href="https://maps.google.com/?q=Seoul+South+Korea"
     target="_blank">
    Открыть карту ↗
  </a>

  <!-- SAVE CONTACT -->
  <button class="save-button" onclick="saveContact()">
    ↓ &nbsp; Сохранить контакт
  </button>

  <!-- SOCIAL LINKS -->
  <div class="socials">
    <a class="social" href="#" aria-label="Telegram">➤</a>
    <a class="social" href="#" aria-label="Instagram">◎</a>
    <a class="social" href="#" aria-label="YouTube">▶</a>
    <a class="social" href="#" aria-label="GitHub">GH</a>
  </div>

  <footer>© 2026 Nova Studio</footer>

</main>

<script>
function saveContact() {
  const vcard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:Nova Studio',
    'ORG:Nova Studio',
    'TEL;TYPE=CELL:+821000000000',
    'EMAIL:hello@example.com',
    'ADR;TYPE=WORK:;;Seoul;;;South Korea',
    'END:VCARD'
  ].join('\r\n');

  const blob = new Blob([vcard], {
    type: 'text/vcard;charset=utf-8'
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'contact.vcf';
  link.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
