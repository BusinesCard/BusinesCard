<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9edf8">
<meta name="description" content="Digital business card">
<title>Nova — Digital Card</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --text: #171923;
  --muted: #73798b;
  --glass: rgba(255, 255, 255, .48);
  --border: rgba(255, 255, 255, .85);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #e9edf8;
}

body {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  margin: 0;
  padding: 45px 18px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow-x: hidden;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: #e9edf8;
}

/* Animated background: 5 big colour blobs drifting across the screen.
   Real elements + plain transform animation (no blur filter, no pseudo-elements),
   so it renders reliably in Safari and Firefox. */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: linear-gradient(160deg, #e6ecfb 0%, #efe9fb 55%, #e3f1f8 100%);
}

.blob {
  position: absolute;
  width: 90vmax;
  height: 90vmax;
  border-radius: 50%;
  will-change: transform;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}

.blob.b1 {
  top: -40vmax;
  left: -35vmax;
  background: radial-gradient(circle, rgba(111, 155, 255, .95) 0%, rgba(111, 155, 255, 0) 60%);
  animation-name: driftA;
  animation-duration: 6s;
}

.blob.b2 {
  top: -35vmax;
  right: -40vmax;
  background: radial-gradient(circle, rgba(176, 124, 255, .9) 0%, rgba(176, 124, 255, 0) 60%);
  animation-name: driftB;
  animation-duration: 7s;
}

.blob.b3 {
  bottom: -40vmax;
  right: -30vmax;
  background: radial-gradient(circle, rgba(79, 209, 232, .9) 0%, rgba(79, 209, 232, 0) 60%);
  animation-name: driftC;
  animation-duration: 8s;
}

.blob.b4 {
  bottom: -35vmax;
  left: -40vmax;
  background: radial-gradient(circle, rgba(255, 156, 207, .85) 0%, rgba(255, 156, 207, 0) 60%);
  animation-name: driftD;
  animation-duration: 6.5s;
}

.blob.b5 {
  top: 5vmax;
  left: 5vmax;
  width: 70vmax;
  height: 70vmax;
  background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 62%);
  animation-name: driftE;
  animation-duration: 9s;
}

@keyframes driftA {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(55%, 45%) scale(1.25); }
}

@keyframes driftB {
  from { transform: translate(0, 0) scale(1.1); }
  to   { transform: translate(-50%, 55%) scale(.9); }
}

@keyframes driftC {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(-55%, -45%) scale(1.3); }
}

@keyframes driftD {
  from { transform: translate(0, 0) scale(.95); }
  to   { transform: translate(50%, -50%) scale(1.2); }
}

@keyframes driftE {
  from { transform: translate(-20%, -10%) scale(1); }
  to   { transform: translate(60%, 50%) scale(1.15); }
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 430px;
  padding: 38px 25px 28px;
  border-radius: 36px;
  background: rgba(255, 255, 255, .30);
  border: 1px solid rgba(255, 255, 255, .78);
  box-shadow: 0 25px 80px rgba(77, 91, 140, .13);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  text-align: center;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .42);
  filter: blur(55px);
  top: -190px;
  left: -100px;
  pointer-events: none;
}

.logo {
  margin: 5px auto 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* The logo is embedded in the HTML (base64), so no separate file is needed.
   It is shown as is: no circle, no background. */
.logo img {
  display: block;
  height: 94px;
  width: auto;
  max-width: 100%;
  object-fit: contain;
}

h1 {
  font-size: 30px;
  margin: 0;
  font-weight: 700;
  letter-spacing: -1.2px;
}

.tagline {
  margin: 9px 0 27px;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: .4px;
}

.line {
  width: 42px;
  height: 2px;
  background: rgba(100, 110, 145, .4);
  margin: 0 auto 25px;
  border-radius: 5px;
}

.bio {
  font-size: 15px;
  line-height: 1.75;
  color: #414758;
  margin: 0 5px 28px;
}

.contacts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 17px;
  border-radius: 19px;
  background: var(--glass);
  border: 1px solid var(--border);
  box-shadow: 0 5px 18px rgba(80, 90, 130, .045);
  text-align: left;
  text-decoration: none;
  color: var(--text);
  transition: transform .25s ease, background .25s ease;
}

.contact:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, .75);
}

.icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: #333c53;
}

.contact-info {
  font-size: 14px;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.contact-info small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 4px;
}

.map-button {
  display: block;
  margin-top: 16px;
  padding: 17px;
  border-radius: 20px;
  background: #fee500;
  color: #191600;
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 10px 25px rgba(120, 100, 0, .22);
  transition: transform .25s ease, box-shadow .25s ease;
}

.map-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(120, 100, 0, .3);
}

.save-button {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, .85);
  background: rgba(255, 255, 255, .5);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .25s ease, transform .25s ease;
}

.save-button:hover {
  background: rgba(255, 255, 255, .8);
  transform: translateY(-1px);
}

.socials {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 27px;
}

.social {
  width: 45px;
  height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, .5);
  border: 1px solid rgba(255, 255, 255, .8);
  color: #28334b;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  transition: transform .25s ease, background .25s ease;
}

.social:hover {
  transform: translateY(-4px);
  background: white;
}

footer {
  margin-top: 30px;
  color: #81899e;
  font-size: 11px;
}

/* The background animation always runs (also when the system has
   "reduce motion" enabled). Only hover transitions are disabled there. */
@media (prefers-reduced-motion: reduce) {
  .contact,
  .map-button,
  .save-button,
  .social {
    transition: none;
  }
}

/* ============ RESPONSIVE: the card always fits the screen, no scrolling ============ */

html {
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  align-items: center;
  padding:
    max(clamp(8px, 2.2dvh, 28px), env(safe-area-inset-top))
    max(clamp(10px, 4vw, 18px), env(safe-area-inset-right))
    max(clamp(8px, 2.2dvh, 28px), env(safe-area-inset-bottom))
    max(clamp(10px, 4vw, 18px), env(safe-area-inset-left));
}

/* Every size depends on BOTH screen width and screen height */
.card {
  padding: clamp(14px, 3.6dvh, 40px) clamp(16px, 5.5vw, 32px) clamp(12px, 3dvh, 30px);
  border-radius: clamp(22px, 6vw, 40px);
  transform-origin: center center;
}

.logo {
  margin: 0 auto clamp(8px, 2dvh, 20px);
}

.logo img {
  height: clamp(56px, min(24vw, 12.5dvh), 120px);
}

h1 {
  font-size: clamp(21px, min(7vw, 4.2dvh), 36px);
}

.tagline {
  margin: clamp(4px, 1dvh, 9px) 0 clamp(10px, 2.6dvh, 27px);
  font-size: clamp(12px, min(3.6vw, 1.9dvh), 15px);
}

.line {
  margin-bottom: clamp(10px, 2.6dvh, 25px);
}

.bio {
  font-size: clamp(12.5px, min(3.8vw, 2dvh), 16px);
  line-height: 1.6;
  margin: 0 5px clamp(12px, 3dvh, 28px);
}

.contacts {
  gap: clamp(6px, 1.2dvh, 10px);
}

.contact {
  gap: clamp(10px, 3vw, 14px);
  padding: clamp(8px, 1.9dvh, 18px) clamp(12px, 3.5vw, 17px);
  border-radius: clamp(14px, 2.6dvh, 19px);
}

.icon {
  width: clamp(18px, 2.8dvh, 22px);
  height: clamp(18px, 2.8dvh, 22px);
}

.contact-info {
  font-size: clamp(12.5px, min(3.6vw, 1.9dvh), 15px);
}

.contact-info small {
  margin-bottom: clamp(1px, .4dvh, 4px);
}

.map-button {
  margin-top: clamp(8px, 1.8dvh, 16px);
  padding: clamp(10px, 2.1dvh, 18px);
  border-radius: clamp(14px, 2.6dvh, 20px);
}

.save-button {
  margin-top: clamp(6px, 1.4dvh, 12px);
  padding: clamp(10px, 2dvh, 17px);
  border-radius: clamp(14px, 2.6dvh, 20px);
}

.socials {
  margin-top: clamp(10px, 2.6dvh, 27px);
  gap: clamp(10px, 3vw, 15px);
}

.social {
  width: clamp(36px, min(11vw, 5.4dvh), 50px);
  height: clamp(36px, min(11vw, 5.4dvh), 50px);
}

footer {
  margin-top: clamp(8px, 2.2dvh, 30px);
}

/* Tablets and desktops: wider card */
@media (min-width: 768px) {
  .card { max-width: 500px; }
}

@media (min-width: 1200px) {
  .card { max-width: 560px; }
}

/* Landscape / short wide screens: two columns so everything fits in height */
@media (orientation: landscape) and (max-height: 600px) and (min-width: 560px) {
  .card {
    max-width: min(900px, 100%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: clamp(20px, 4vw, 48px);
    align-items: center;
    padding: clamp(10px, 3dvh, 24px) clamp(18px, 3vw, 36px);
  }

  .bio {
    margin-bottom: 0;
  }

  footer {
    margin-top: clamp(6px, 1.6dvh, 14px);
  }
}

/* Touch devices: no sticky hover lift after tapping */
@media (hover: none) {
  .contact:hover,
  .map-button:hover,
  .save-button:hover,
  .social:hover {
    transform: none;
  }
}

/* Social links are temporarily hidden.
   To show them again, delete this rule. */
.socials {
  display: none;
}

</style>
</head>

</div>

function saveContact() {
  const vcard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:Nova Studio',
    'ORG:Nova Studio',
    'TEL;TYPE=CELL:+821000000000',
    'ADR;TYPE=WORK:;;10-1 Dongdae-ro;Gyeongju-si;Gyeongsangbuk-do;;South Korea',
    'END:VCARD'
  ].join('\r\n');

  const blob = new Blob([vcard], {
    type: 'text/vcard;charset=utf-8'
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'contact.vcf';
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Safety net: if the content is still taller/wider than the screen
   (very small screens, huge system font size), shrink the card to fit. */
(function () {
  var card = document.querySelector('.card');

  function fitCard() {
    card.style.transform = '';
    var cs = getComputedStyle(document.body);
    var availH = document.body.clientHeight
      - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var availW = document.body.clientWidth
      - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var r = card.getBoundingClientRect();
    var scale = Math.min(1, availH / r.height, availW / r.width);
    if (scale < 1) {
      card.style.transform = 'scale(' + scale.toFixed(4) + ')';
    }
  }

  window.addEventListener('resize', fitCard);
  window.addEventListener('orientationchange', function () {
    setTimeout(fitCard, 250);
  });
  window.addEventListener('load', fitCard);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCard);
  }
  fitCard();
})();
</script>
